[package]
name = "yoyoku-dataset-prep"
version = "1.0.0"
description = "Yoyoku Dataset Prep"
authors = ["Yoyoku"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "yoyoku_dataset_prep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
rfd = "0.15"
tempfile = "3"
unicode-normalization = "0.1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
